# SolFlow on-demand compiler — runs on free GitHub Actions runners.
# Triggered by the web app (workflow_dispatch) to compile Pinocchio/Quasar
# programs with cargo-build-sbf. Produces a real deployable .so artifact.
# Free: unlimited minutes on public repos, 2000 min/mo on private.
name: compile

on:
  workflow_dispatch:
    inputs:
      framework:
        description: "anchor | pinocchio | quasar"
        required: true
        default: "pinocchio"
  push:
    paths:
      - "programs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana + Rust toolchain (cargo-build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          # GITHUB_PATH only applies to SUBSEQUENT steps, so also export for THIS step
          # (otherwise the version checks below fail with "command not found" under set -e).
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          solana --version
          cargo-build-sbf --version

      - name: Build program (cargo-build-sbf)
        id: build
        run: |
          cd programs/program
          cargo-build-sbf 2>&1 | tee /tmp/build.log
          SO=$(find target/deploy -name "*.so" | head -1)
          echo "so_path=$SO" >> "$GITHUB_OUTPUT"
          echo "so_size=$(stat -c%s "$SO" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Upload .so binary
        uses: actions/upload-artifact@v4
        with:
          name: program-so
          path: programs/program/target/deploy/*.so
          if-no-files-found: error

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
