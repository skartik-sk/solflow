[package]
name = "quasar-expand"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quasar-derive = { path = "vendor/quasar-derive" }
proc-macro2 = { version = "1", default-features = false }
quote = "1"
syn = { version = "2", features = ["full", "visit-mut", "extra-traits"] }
prettyplease = "0.2"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
